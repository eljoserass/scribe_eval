# Fact checks need a local OpenAI-compatible server. See docs/metrics.md.
name = "primock57-facts"

[pipeline]
type = "scribnic"
workflow = "../workflows/whisper_small_bonsai_en.toml"

[judge]
base_url = "http://127.0.0.1:8090/v1"
model = "judge"

[judge.options]
max_tokens = 4096
chat_template_kwargs = { enable_thinking = false }

[[datasets]]
name = "primock57"
split = "all"
input = "audio"
limit = 3
seed = 42
metrics = ["transcription", "note_format", "note_reference", "note_facts", "resources"]
