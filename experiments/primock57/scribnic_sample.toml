# A few consultations, sized for a laptop.
# Kind: out of the box, with Scribnic's English workflow.
name = "scribnic-primock57-sample"

[pipeline]
type = "scribnic"
workflow = "../../workflows/whisper_small_bonsai_en.toml"

[[datasets]]
name = "primock57"
split = "all"
input = "audio"
limit = 3
seed = 42
metrics = ["transcription", "note_format", "note_reference", "resources"]
