# The note step alone: TEME-v1 scripts, without speaker labels, go straight to the
# note model. Compare with scribnic_es.toml to see what transcription errors cost.
# Kind: out of the box.
name = "scribnic-teme-es-text"

[pipeline]
type = "scribnic"
workflow = "whisper_bonsai"

[judge]
base_url = "http://127.0.0.1:8090/v1"
model = "judge"

[judge.options]
max_tokens = 4096
chat_template_kwargs = { enable_thinking = false }

[[datasets]]
name = "teme"
split = "all"
input = "transcript"
limit = 10
seed = 42
metrics = ["note_format", "note_grounding", "resources"]
