# The smoke sample through the rolling window, fed as fast as it can process.
# Kind: out of the box.
name = "scribnic-smoke-streaming"

[pipeline]
type = "scribnic"
workflow = "whisper_bonsai_streaming"

[[datasets]]
name = "smoke"
split = "all"
input = "audio"
metrics = ["transcription", "note_format", "note_reference", "resources"]
