[project]
name = "scribe-eval"
version = "0.1.0"
description = "Evaluation harness for clinical scribe workflows"
readme = "README.md"
license = "MIT"
license-files = [
    "LICENSE",
    "src/scribe_eval/metrics/assets/NOTICE",
    "src/scribe_eval/metrics/whisper_normalizers/LICENSE",
]
requires-python = ">=3.12"
dependencies = [
    "jiwer>=4,<5",
    "more-itertools>=10,<12",
    "nltk>=3.9,<4",
    "num2words>=0.5,<1",
    "numpy>=2,<3",
    "psutil>=7,<8",
    "rapidfuzz>=3,<4",
    "regex>=2024.4,<2027",
    "rich>=15,<16",
    "rouge-score>=0.1.2,<0.2",
    "sacrebleu>=2.5,<3",
    "textstat>=0.7,<1",
    "typer>=0.27,<0.28",
]

[project.optional-dependencies]
diarization = ["pyannote.metrics>=4,<5"]
semantic = ["bert-score>=0.3.13", "bleurt-pytorch>=0.0.1", "protobuf>=4", "torch>=2.2", "transformers>=4.40,<5"]
scribnic = ["scribnic"]

[project.scripts]
scribe-eval = "scribe_eval.cli:main"

[dependency-groups]
# What the checks need. CI installs only this group: it has no Scribnic checkout.
checks = ["pyannote.metrics>=4,<5", "ruff>=0.14,<1"]
dev = [{ include-group = "checks" }, "scribnic"]

[tool.uv.sources]
scribnic = { path = "../scribnic", editable = true }

[tool.ruff]
line-length = 88
# Copied verbatim from openai/whisper; kept as published.
extend-exclude = ["src/scribe_eval/metrics/whisper_normalizers"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "D2", "D3", "D4"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scribe_eval"
