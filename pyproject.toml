[project]
name = "scribe-eval"
version = "0.1.0"
description = "Evaluation harness for clinical scribe workflows"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "jiwer>=4,<5",
    "nltk>=3.9,<4",
    "num2words>=0.5,<1",
    "numpy>=2,<3",
    "psutil>=7,<8",
    "rapidfuzz>=3,<4",
    "rich>=15,<16",
    "rouge-score>=0.1.2,<0.2",
    "sacrebleu>=2.5,<3",
    "textstat>=0.7,<1",
    "typer>=0.27,<0.28",
]

[project.optional-dependencies]
diarization = ["pyannote.metrics>=4,<5"]
scribnic = ["scribnic"]

[project.scripts]
scribe-eval = "scribe_eval.cli:main"

[dependency-groups]
dev = ["pyannote.metrics>=4,<5", "ruff>=0.14,<1", "scribnic"]

[tool.uv.sources]
scribnic = { path = "../scribnic", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D2", "D3", "D4"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "scribe_eval"
