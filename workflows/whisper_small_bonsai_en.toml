# English variant of Scribnic's whisper_bonsai preset, for English datasets.
name = "whisper_small_bonsai_en"
inputs = ["audio", "transcript", "diarized_transcript"]
default_output = "note"
download_missing = true

[steps.speech]
backend = "openai_transcription"
model = "whisper_small_q8_0"
runtime = "whisper_cpp"

[steps.speech.model_settings]
language = "en"

[steps.note]
backend = "openai_chat"
model = "Ternary-Bonsai-2-2B-PQ2_0"
runtime = "llama_cpp_prism"
template = "soap_en.md"
source = "speech"

[steps.note.model_settings]
temperature = 0.0
